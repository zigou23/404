<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国银行汇率</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0e17;
  --surface: #111827;
  --surface2: #1a2235;
  --border: #1e2d45;
  --accent: #22c55e;
  --accent-dim: rgba(34,197,94,0.12);
  --accent-glow: rgba(34,197,94,0.25);
  --red: #ef4444;
  --text: #e2e8f0;
  --muted: #64748b;
  --muted2: #334155;
  --gold: #f59e0b;
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --serif: 'Noto Serif SC', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Grid bg ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(34,197,94,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,197,94,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ── Header ── */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,14,23,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px;
}

.logo {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--serif);
  font-size: 16px; font-weight: 600;
  color: var(--text);
}
.logo-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(0.8); }
}

.header-time {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
}

/* ── Layout ── */
.main {
  position: relative; z-index: 1;
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px 24px 80px;
  display: grid;
  grid-template-columns: 1fr 340px;
  grid-template-rows: auto auto 1fr;
  gap: 20px;
}

/* ── Currency Selector (top bar) ── */
.currency-bar {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
}

.cur-label {
  font-size: 12px; color: var(--muted);
  font-family: var(--mono);
  text-transform: uppercase; letter-spacing: 0.08em;
}

.cur-select-wrap {
  position: relative;
}
.cur-select-wrap::after {
  content: '▾';
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none; font-size: 11px;
}
select {
  appearance: none;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 32px 8px 12px;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 13px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
select:focus, select:hover { border-color: var(--accent); }

.cur-arrow {
  color: var(--muted); font-size: 16px;
  cursor: pointer;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 7px 14px; border-radius: 8px;
  transition: all 0.2s;
  font-family: var(--mono);
}
.cur-arrow:hover { border-color: var(--accent); color: var(--accent); }

/* ── Chart Card ── */
.chart-card {
  grid-column: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}

.chart-head {
  padding: 20px 24px 0;
}

.pair-label {
  font-family: var(--mono);
  font-size: 12px; color: var(--muted);
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 4px;
}

.rate-display {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 4px;
}
.rate-big {
  font-family: var(--mono);
  font-size: 36px; font-weight: 500;
  color: var(--text);
  letter-spacing: -0.02em;
}
.rate-change {
  font-family: var(--mono);
  font-size: 14px;
  padding: 2px 8px; border-radius: 4px;
}
.rate-change.up { color: var(--accent); background: var(--accent-dim); }
.rate-change.down { color: var(--red); background: rgba(239,68,68,0.12); }

.rate-hover-label {
  font-size: 12px; color: var(--muted); font-family: var(--mono);
  min-height: 18px;
}

/* Time range selector */
.time-tabs {
  display: flex; gap: 2px;
  padding: 12px 24px 0;
}
.time-tab {
  padding: 5px 12px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.05em;
}
.time-tab:hover { color: var(--text); background: var(--surface2); }
.time-tab.active { color: var(--accent); background: var(--accent-dim); }

/* SVG Chart */
.chart-wrap {
  padding: 8px 0 0;
  position: relative;
  height: 260px;
}
#chart-svg {
  width: 100%; height: 100%;
  display: block;
}
.chart-tooltip {
  position: absolute;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.1s;
  white-space: nowrap;
  z-index: 10;
}
.chart-tooltip.visible { opacity: 1; }

/* ── Converter Card ── */
.converter-card {
  grid-column: 2;
  grid-row: 2 / 4;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  align-self: start;
  position: sticky;
  top: 76px;
}

.card-title {
  font-family: var(--serif);
  font-size: 15px; font-weight: 600;
  color: var(--text);
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
.card-title-icon {
  width: 24px; height: 24px;
  background: var(--accent-dim);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}

.conv-field {
  margin-bottom: 12px;
}
.conv-field label {
  display: block;
  font-size: 11px; font-family: var(--mono);
  color: var(--muted); letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.conv-input-wrap {
  display: flex; gap: 8px;
}
.conv-input-wrap input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
  width: 0;
}
.conv-input-wrap input:focus { border-color: var(--accent); }
.conv-input-wrap select { flex: 0 0 90px; }

.swap-row {
  display: flex; align-items: center; justify-content: center;
  margin: 4px 0;
}
.swap-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  width: 32px; height: 32px;
  border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
  font-family: var(--mono);
}
.swap-btn:hover { border-color: var(--accent); color: var(--accent); transform: rotate(180deg); }

.conv-result-box {
  margin-top: 16px;
  background: var(--accent-dim);
  border: 1px solid rgba(34,197,94,0.2);
  border-radius: 10px;
  padding: 16px;
  min-height: 72px;
}
.conv-result-small {
  font-size: 11px; color: var(--accent);
  font-family: var(--mono); letter-spacing: 0.08em;
  text-transform: uppercase; margin-bottom: 6px;
}
.conv-result-num {
  font-family: var(--mono);
  font-size: 24px; font-weight: 500;
  color: var(--text);
}
.conv-result-rate {
  font-size: 11px; color: var(--muted);
  font-family: var(--mono); margin-top: 4px;
}

.data-note {
  font-size: 11px; color: var(--muted2);
  font-family: var(--mono);
  margin-top: 16px;
  line-height: 1.6;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}

/* ── Rates Table Card ── */
.rates-card {
  grid-column: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}

.rates-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}

.search-wrap {
  position: relative;
}
.search-wrap::before {
  content: '⌕';
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 16px; pointer-events: none;
}
.search-wrap input {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 12px 7px 30px;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 12px; outline: none;
  width: 180px;
  transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: var(--accent); }

.updated-tag {
  font-size: 11px; font-family: var(--mono);
  color: var(--muted);
}
.updated-tag .dot {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  margin-right: 5px;
  animation: pulse 2s infinite;
}

table {
  width: 100%; border-collapse: collapse;
}
thead th {
  padding: 10px 16px;
  text-align: right;
  font-size: 11px; font-family: var(--mono);
  color: var(--muted); font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--surface2);
  white-space: nowrap;
}
thead th:first-child { text-align: left; }
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--text); }

tbody tr {
  border-top: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
tbody tr:hover { background: var(--surface2); }
tbody tr.selected { background: var(--accent-dim) !important; }

tbody td {
  padding: 11px 16px;
  text-align: right;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
}
tbody td:first-child {
  text-align: left;
}
.td-name { font-family: var(--sans); font-size: 13px; }
.td-code {
  font-family: var(--mono); font-size: 11px;
  color: var(--muted); margin-left: 6px;
}
.null-val { color: var(--muted2); }

/* Loading / Error */
.state-msg {
  display: flex; align-items: center; justify-content: center;
  padding: 60px 20px;
  color: var(--muted);
  font-family: var(--mono); font-size: 13px;
  gap: 10px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Responsive ── */
@media (max-width: 900px) {
  .main {
    grid-template-columns: 1fr;
    padding: 16px;
  }
  .chart-card, .converter-card, .rates-card { grid-column: 1; grid-row: auto; }
  .converter-card { position: static; }
  .rate-big { font-size: 28px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    中国银行 汇率
  </div>
  <div class="header-time" id="header-clock"></div>
</header>

<div class="main">

  <!-- ── Currency Pair Selector ── -->
  <div class="currency-bar">
    <span class="cur-label">基础货币</span>
    <div class="cur-select-wrap">
      <select id="base-cur" onchange="onPairChange()"></select>
    </div>
    <span class="cur-label" style="margin-left:4px">/ CNY</span>
    <span style="flex:1"></span>
    <span class="cur-label" style="font-size:11px;color:var(--muted2)">数据：中国银行官网</span>
  </div>

  <!-- ── Chart Card ── -->
  <div class="chart-card">
    <div class="chart-head">
      <div class="pair-label" id="pair-label">USD / CNY</div>
      <div class="rate-display">
        <div class="rate-big" id="rate-big">—</div>
        <div class="rate-change" id="rate-change"></div>
      </div>
      <div class="rate-hover-label" id="rate-hover-label">中间价（每100外币兑人民币）</div>
    </div>
    <div class="time-tabs" id="time-tabs">
      <button class="time-tab" data-range="7">1W</button>
      <button class="time-tab" data-range="30">1M</button>
      <button class="time-tab" data-range="90">3M</button>
      <button class="time-tab active" data-range="180">6M</button>
      <button class="time-tab" data-range="365">1Y</button>
    </div>
    <div class="chart-wrap" id="chart-wrap">
      <svg id="chart-svg" viewBox="0 0 800 260" preserveAspectRatio="none"></svg>
      <div class="chart-tooltip" id="chart-tooltip"></div>
    </div>
  </div>

  <!-- ── Converter Card ── -->
  <div class="converter-card">
    <div class="card-title">
      <div class="card-title-icon">💱</div>
      实时换算
    </div>

    <div class="conv-field">
      <label>金额</label>
      <div class="conv-input-wrap">
        <input type="number" id="conv-amount" value="100" min="0" step="any" oninput="doConvert()">
        <select id="conv-from" onchange="doConvert()"></select>
      </div>
    </div>

    <div class="swap-row">
      <button class="swap-btn" onclick="swapConv()" title="互换">⇅</button>
    </div>

    <div class="conv-field">
      <label>目标货币</label>
      <div class="conv-input-wrap">
        <input type="number" id="conv-result-input" readonly style="color:var(--accent);cursor:default">
        <select id="conv-to" onchange="doConvert()"></select>
      </div>
    </div>

    <div class="conv-result-box">
      <div class="conv-result-small" id="conv-rate-type">换算结果</div>
      <div class="conv-result-num" id="conv-result-num">—</div>
      <div class="conv-result-rate" id="conv-result-rate"></div>
      <div style="margin-top:10px;display:flex;gap:6px;">
        <button id="btn-buy"  onclick="setRateType('buy')"
          style="flex:1;padding:6px;border-radius:6px;border:1px solid var(--border);
                background:var(--accent-dim);color:var(--accent);font-family:var(--mono);
                font-size:11px;cursor:pointer;transition:all 0.2s">
          现汇买入
        </button>
        <button id="btn-sell" onclick="setRateType('sell')"
          style="flex:1;padding:6px;border-radius:6px;border:1px solid var(--border);
                background:var(--surface2);color:var(--muted);font-family:var(--mono);
                font-size:11px;cursor:pointer;transition:all 0.2s">
          现汇卖出
        </button>
      </div>
    </div>

    <div class="data-note">
      ✦ 汇率基于今日中国银行现汇卖出价<br>
      ✦ 换算在本地完成，不发送请求<br>
      ✦ 仅供参考，实际交易以银行为准
    </div>
  </div>

  <!-- ── Rates Table ── -->
  <div class="rates-card">
    <div class="rates-head">
      <div class="card-title" style="margin:0">
        <div class="card-title-icon">📊</div>
        今日汇率
      </div>
      <div class="search-wrap">
        <input type="text" id="search" placeholder="搜索..." oninput="filterTable()">
      </div>
      <div class="updated-tag">
        <span class="dot"></span>
        <span id="updated-label">加载中...</span>
      </div>
    </div>
    <div id="table-wrap">
      <div class="state-msg"><div class="spinner"></div> 加载今日汇率...</div>
    </div>
  </div>

</div><!-- .main -->

<script>
// ════════════════════════════════════════
// CONFIG — 改成你的 Worker 地址
// ════════════════════════════════════════
const API_BASE = 'https://exchange-api.123060.xyz';

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let todayRates = {};       // { USD: { buy_spot, sell_spot, ... }, ... }
let currencies = [];       // [{ code, name_cn }]
let historyData = [];      // [{date, rate}, ...] for chart
let selectedCurrency = 'USD';
let rateType = 'buy'; // 'buy' 现汇买入(人民币→外币用卖出价) | 'sell' 现汇卖出(外币→人民币用买入价)
let chartRange = 180;
let allTableRows = [];

const CURRENCY_NAMES = {};

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
async function init() {
  startClock();
  await Promise.all([loadCurrencies(), loadTodayRates()]);
  buildSelectors();
  renderTable();
  doConvert();
  await loadHistory('USD', 180);
  setupChartHover();
}

// ════════════════════════════════════════
// CLOCK
// ════════════════════════════════════════
function startClock() {
  function update() {
    const now = new Date();
    document.getElementById('header-clock').textContent =
      now.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai',
        year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', second:'2-digit' }) + ' CST';
  }
  update(); setInterval(update, 1000);
}

// ════════════════════════════════════════
// DATA LOADING
// ════════════════════════════════════════
async function loadCurrencies() {
  try {
    const res = await fetch(`${API_BASE}/api/currencies`);
    const json = await res.json();
    currencies = json.data || [];
    currencies.forEach(c => CURRENCY_NAMES[c.code] = c.name_cn);
  } catch(e) { console.error('currencies:', e); }
}

async function loadTodayRates() {
  try {
    const res = await fetch(`${API_BASE}/api/today`);
    const json = await res.json();
    (json.data || []).forEach(r => { todayRates[r.currency] = r; });

    const t = json.updated_at || '';
    document.getElementById('updated-label').textContent = t ? `数据时间 ${t}` : '今日数据';
  } catch(e) {
    document.getElementById('updated-label').textContent = '加载失败';
  }
}

// 历史数据：直接从中行API拉取，走 Worker 代理避免跨域
async function loadHistory(currency, days) {
  setChartLoading();
  try {
    const res = await fetch(`${API_BASE}/api/history-chart?currency=${currency}&days=${days}`);
    const json = await res.json();
    historyData = (json.data || []).map(d => ({
      date:      d.rate_date,
      sell_spot: d.sell_spot,
      buy_spot:  d.buy_spot,
      mid_rate:  d.mid_rate,
      rate:      d.mid_rate ?? d.sell_spot ?? d.buy_spot, // 优先用中间价
    })).filter(d => d.rate != null).sort((a,b) => a.date.localeCompare(b.date));
    renderChart();
  } catch(e) {
    setChartError();
  }
}

// ════════════════════════════════════════
// SELECTORS
// ════════════════════════════════════════
function buildSelectors() {
  const baseSel = document.getElementById('base-cur');
  const fromSel = document.getElementById('conv-from');
  const toSel   = document.getElementById('conv-to');

  baseSel.innerHTML = '';
  fromSel.innerHTML = '';
  toSel.innerHTML   = '<option value="CNY">CNY 人民币</option>';

  currencies.forEach(c => {
    const label = `${c.code}  ${c.name_cn}`;
    baseSel.appendChild(new Option(label, c.code));
    fromSel.appendChild(new Option(label, c.code));
    toSel.appendChild(new Option(label, c.code));
  });

  baseSel.value = 'USD';
  fromSel.value = 'USD';
  toSel.value   = 'CNY';
}

function onPairChange() {
  selectedCurrency = document.getElementById('base-cur').value;
  document.getElementById('pair-label').textContent = `${selectedCurrency} / CNY`;
  loadHistory(selectedCurrency, chartRange);
  updateChartHeader();
}

// ════════════════════════════════════════
// CHART
// ════════════════════════════════════════
function setChartLoading() {
  const svg = document.getElementById('chart-svg');
  svg.innerHTML = `<text x="400" y="130" text-anchor="middle" fill="#334155" font-family="DM Mono" font-size="13">加载中...</text>`;
  document.getElementById('rate-big').textContent = '—';
  document.getElementById('rate-change').textContent = '';
  document.getElementById('rate-change').className = 'rate-change';
}
function setChartError() {
  const svg = document.getElementById('chart-svg');
  svg.innerHTML = `<text x="400" y="130" text-anchor="middle" fill="#ef4444" font-family="DM Mono" font-size="13">暂无数据</text>`;
}

function updateChartHeader() {
  const r = todayRates[selectedCurrency];
  if (!r) return;
  const val = r.sell_spot ?? r.buy_spot;
  if (!val) return;
  document.getElementById('rate-big').textContent = (val / 100).toFixed(4);
}

function renderChart() {
  if (!historyData.length) { setChartError(); return; }

  const data = historyData;
  const rates = data.map(d => d.rate / 100);
  const min = Math.min(...rates);
  const max = Math.max(...rates);
  const range = max - min || 1;
  const pad = range * 0.08;
  const lo = min - pad, hi = max + pad;

  const W = 800, H = 260;
  const PL = 8, PR = 8, PT = 16, PB = 40;
  const cw = W - PL - PR, ch = H - PT - PB;

  const px = (i) => PL + (i / (data.length - 1)) * cw;
  const py = (v) => PT + ch - ((v - lo) / (hi - lo)) * ch;

  // gradient fill path
  const pts = rates.map((v,i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  const lineD = rates.map((v,i) => `${i===0?'M':'L'}${px(i).toFixed(1)} ${py(v).toFixed(1)}`).join(' ');
  const fillD = lineD + ` L${px(data.length-1).toFixed(1)} ${(PT+ch).toFixed(1)} L${PL} ${(PT+ch).toFixed(1)} Z`;

  // horizontal grid lines
  const gridLines = 4;
  let gridHTML = '';
  for (let i = 0; i <= gridLines; i++) {
    const v = lo + (hi - lo) * (i / gridLines);
    const y = py(v);
    const label = (v).toFixed(3);
    gridHTML += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#1e2d45" stroke-width="1"/>`;
    gridHTML += `<text x="${PL+2}" y="${(y-3).toFixed(1)}" fill="#334155" font-size="9" font-family="DM Mono">${label}</text>`;
  }

  // x-axis labels (show ~6 dates)
  const step = Math.floor(data.length / 5);
  let xLabels = '';
  for (let i = 0; i < data.length; i += step) {
    const d = data[i].date;
    const label = `${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)}`;
    xLabels += `<text x="${px(i).toFixed(1)}" y="${(H-8).toFixed(1)}" fill="#334155" font-size="9" font-family="DM Mono" text-anchor="middle">${label}</text>`;
  }

  // first/last values for header
  const first = rates[0], last = rates[rates.length - 1];
  const diff = last - first;
  const pct = ((diff / first) * 100).toFixed(2);
  const isUp = diff >= 0;
  const color = isUp ? '#22c55e' : '#ef4444';

  document.getElementById('rate-big').textContent = last.toFixed(4);
  const chEl = document.getElementById('rate-change');
  chEl.textContent = `${isUp?'+':''}${diff.toFixed(4)} (${isUp?'+':''}${pct}%)`;
  chEl.className = `rate-change ${isUp?'up':'down'}`;

  const svg = document.getElementById('chart-svg');
  svg.innerHTML = `
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridHTML}
    <path d="${fillD}" fill="url(#grad)"/>
    <path d="${lineD}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>
    ${xLabels}
    <line id="crosshair-v" x1="0" y1="${PT}" x2="0" y2="${PT+ch}" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
    <circle id="crosshair-dot" cx="0" cy="0" r="4" fill="${color}" stroke="#111827" stroke-width="2" opacity="0"/>
  `;

  // store for hover
  svg._chartData = { data, rates, px, py, lo, hi, ch, PT, PL, PB, W, H, cw, color };
}

function setupChartHover() {
  const wrap = document.getElementById('chart-wrap');
  const svg  = document.getElementById('chart-svg');
  const tip  = document.getElementById('chart-tooltip');
  const hoverLabel = document.getElementById('rate-hover-label');

  wrap.addEventListener('mousemove', e => {
    const cd = svg._chartData;
    if (!cd) return;
    const rect = svg.getBoundingClientRect();
    const scaleX = cd.W / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;

    const idx = Math.round(((mx - cd.PL) / cd.cw) * (cd.data.length - 1));
    const cIdx = Math.max(0, Math.min(cd.data.length - 1, idx));
    const d = cd.data[cIdx];
    const v = cd.rates[cIdx];
    const x = cd.px(cIdx);
    const y = cd.py(v);

    const vLine = document.getElementById('crosshair-v');
    const dot   = document.getElementById('crosshair-dot');
    if (vLine) { vLine.setAttribute('x1', x); vLine.setAttribute('x2', x); vLine.setAttribute('opacity','1'); }
    if (dot)   { dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('opacity','1'); }

    const dateStr = `${d.date.slice(0,4)}/${d.date.slice(4,6)}/${d.date.slice(6,8)}`;
    tip.textContent = `${dateStr}  ${v.toFixed(4)}`;
    tip.classList.add('visible');

    // position tooltip
    const tipX = e.clientX - rect.left + 14;
    const tipY = e.clientY - rect.top - 36;
    tip.style.left = `${Math.min(tipX, rect.width - 160)}px`;
    tip.style.top  = `${Math.max(0, tipY)}px`;

    hoverLabel.textContent = `${dateStr} · 中间价 ${v.toFixed(4)} 元`;
  });

  wrap.addEventListener('mouseleave', () => {
    tip.classList.remove('visible');
    const vLine = document.getElementById('crosshair-v');
    const dot   = document.getElementById('crosshair-dot');
    if (vLine) vLine.setAttribute('opacity','0');
    if (dot)   dot.setAttribute('opacity','0');
    document.getElementById('rate-hover-label').textContent = `${dateStr} · 中间价 ${v.toFixed(4)} 元`;
  });
}

// Time range tabs
document.getElementById('time-tabs').addEventListener('click', e => {
  const btn = e.target.closest('.time-tab');
  if (!btn) return;
  chartRange = parseInt(btn.dataset.range);
  document.querySelectorAll('.time-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadHistory(selectedCurrency, chartRange);
});

// ════════════════════════════════════════
// TABLE
// ════════════════════════════════════════
function renderTable() {
  const wrap = document.getElementById('table-wrap');

  if (!Object.keys(todayRates).length) {
    wrap.innerHTML = '<div class="state-msg">暂无今日数据</div>';
    return;
  }

  const rows = currencies.map(c => {
    const r = todayRates[c.code];
    if (!r) return null;
    return { code: c.code, name: c.name_cn, ...r };
  }).filter(Boolean);

  allTableRows = rows;

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>货币</th>
          <th>现汇买入</th>
          <th>现钞买入</th>
          <th>现汇卖出</th>
          <th>现钞卖出</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  `;

  renderTableBody(rows);
}

function renderTableBody(rows) {
  const tbody = document.getElementById('table-body');
  if (!tbody) return;

  const fmt = v => v != null
    ? `<span>${(v/100).toFixed(4)}</span>`
    : `<span class="null-val">—</span>`;

  tbody.innerHTML = rows.map(r => `
    <tr data-code="${r.code}" onclick="selectRowCurrency('${r.code}')"
        class="${r.code === selectedCurrency ? 'selected' : ''}">
      <td>
        <span class="td-name">${r.name}</span>
        <span class="td-code">${r.code}</span>
      </td>
      <td>${fmt(r.buy_spot)}</td>
      <td>${fmt(r.buy_cash)}</td>
      <td>${fmt(r.sell_spot)}</td>
      <td>${fmt(r.sell_cash)}</td>
    </tr>
  `).join('');
}

function selectRowCurrency(code) {
  selectedCurrency = code;
  document.getElementById('base-cur').value = code;
  document.querySelectorAll('#table-body tr').forEach(tr => {
    tr.classList.toggle('selected', tr.dataset.code === code);
  });
  document.getElementById('pair-label').textContent = `${code} / CNY`;
  loadHistory(code, chartRange);
}

function filterTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = allTableRows.filter(r =>
    r.code.toLowerCase().includes(q) || r.name.includes(q)
  );
  renderTableBody(filtered);
}

// ════════════════════════════════════════
// CONVERTER — 纯前端计算，零请求
// ════════════════════════════════════════
function doConvert() {
  const amount = parseFloat(document.getElementById('conv-amount').value);
  const from   = document.getElementById('conv-from').value;
  const to     = document.getElementById('conv-to').value;

  if (isNaN(amount) || amount < 0) { clearConvResult(); return; }

  const fromR = todayRates[from];
  const toR   = todayRates[to];

  let result, rateStr, rateLabel;

  if (from === 'CNY' && to === 'CNY') {
    result    = amount;
    rateStr   = '1:1';
    rateLabel = '换算结果';

  } else if (from === 'CNY' && to !== 'CNY') {
    // 人民币 → 外币
    // 现汇买入：银行买入外币（客户卖出外币换人民币），此方向用卖出价
    // 现汇卖出：银行卖出外币（客户买入外币），用卖出价
    // 人民币换外币，银行角度是"卖出外币"，客户用的是卖出价
    const rate = rateType === 'buy'
      ? toR?.buy_spot   // 现汇买入：参考买入价（银行买入该外币的价格）
      : toR?.sell_spot; // 现汇卖出：参考卖出价（银行卖出该外币的价格）
    if (!rate) { clearConvResult('该货币暂无汇率'); return; }
    result    = (amount / rate) * 100;
    rateStr   = `1 CNY = ${(100 / rate).toFixed(6)} ${to}`;
    rateLabel = rateType === 'buy'
      ? `📥 现汇买入价 · ${(rate / 100).toFixed(4)} CNY/${to}`
      : `📤 现汇卖出价 · ${(rate / 100).toFixed(4)} CNY/${to}`;

  } else if (from !== 'CNY' && to === 'CNY') {
    // 外币 → 人民币
    // 现汇买入：银行买入外币，给客户人民币 → 用买入价（对客户有利）
    // 现汇卖出：参考卖出价
    const rate = rateType === 'buy'
      ? fromR?.buy_spot   // 现汇买入：银行以买入价收你的外币
      : fromR?.sell_spot; // 现汇卖出：参考卖出价
    if (!rate) { clearConvResult('该货币暂无汇率'); return; }
    result    = (amount * rate) / 100;
    rateStr   = `1 ${from} = ${(rate / 100).toFixed(6)} CNY`;
    rateLabel = rateType === 'buy'
      ? `📥 现汇买入价 · ${(rate / 100).toFixed(4)} CNY/${from}`
      : `📤 现汇卖出价 · ${(rate / 100).toFixed(4)} CNY/${from}`;

  } else {
    // 外币 → 外币：先按选定价格换成CNY，再换目标
    const rFrom = rateType === 'buy' ? fromR?.buy_spot  : fromR?.sell_spot;
    const rTo   = rateType === 'buy' ? toR?.sell_spot   : toR?.buy_spot;
    if (!rFrom || !rTo) { clearConvResult('该货币暂无汇率'); return; }
    const cny  = (amount * rFrom) / 100;
    result     = (cny / rTo) * 100;
    rateStr    = `via CNY · 1 ${from} ≈ ${(rFrom / rTo).toFixed(6)} ${to}`;
    rateLabel  = rateType === 'buy' ? '📥 现汇买入价' : '📤 现汇卖出价';
  }

  const toName   = to   === 'CNY' ? '人民币' : (CURRENCY_NAMES[to]   || to);
  const fromName = from === 'CNY' ? '人民币' : (CURRENCY_NAMES[from] || from);

  document.getElementById('conv-result-input').value = result.toFixed(4);
  document.getElementById('conv-result-num').textContent  = `${result.toFixed(4)} ${toName}`;
  document.getElementById('conv-result-rate').textContent = rateStr;
  document.getElementById('conv-rate-type').textContent   = rateLabel;
}

function setRateType(type) {
  rateType = type;
  const btnBuy  = document.getElementById('btn-buy');
  const btnSell = document.getElementById('btn-sell');
  if (type === 'buy') {
    btnBuy.style.background  = 'var(--accent-dim)';
    btnBuy.style.color       = 'var(--accent)';
    btnBuy.style.borderColor = 'rgba(34,197,94,0.3)';
    btnSell.style.background = 'var(--surface2)';
    btnSell.style.color      = 'var(--muted)';
    btnSell.style.borderColor= 'var(--border)';
  } else {
    btnSell.style.background  = 'var(--accent-dim)';
    btnSell.style.color       = 'var(--accent)';
    btnSell.style.borderColor = 'rgba(34,197,94,0.3)';
    btnBuy.style.background   = 'var(--surface2)';
    btnBuy.style.color        = 'var(--muted)';
    btnBuy.style.borderColor  = 'var(--border)';
  }
  doConvert();
}

function clearConvResult(msg = '') {
  document.getElementById('conv-result-input').value = '';
  document.getElementById('conv-result-num').textContent = msg || '—';
  document.getElementById('conv-result-rate').textContent = '';
}

function swapConv() {
  const from = document.getElementById('conv-from');
  const to   = document.getElementById('conv-to');
  const tmp  = from.value;
  from.value = to.value;
  to.value   = tmp;
  doConvert();
}
